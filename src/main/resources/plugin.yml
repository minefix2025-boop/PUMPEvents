name: PUMPEvents
version: 1.3.0
main: ru.pumpcraft.pumpevents.PUMPEvents
api-version: '1.21'
author: PUMPCraft
description: World events and collectible hunts for the PUMPCraft server
commands:
  pumpevents:
    description: Show PUMPEvents help and current event status
    usage: /pumpevents
    permission: pumpevents.admin
  meteor:
    description: Start a meteor event at coordinates or at your position
    usage: /meteor <x> <y> <z> | /meteor @s
    permission: pumpevents.admin
  pumpkincreate:
    description: Create an event pumpkin at your position
    usage: /pumpkincreate @s
    permission: pumpevents.admin
  pumpkinhunt:
    description: Start or stop the collectible Pumpkin Hunt
    usage: /pumpkinhunt <start|stop>
    permission: pumpevents.admin
  midnightpump:
    description: Start the Midnight Pumpkin event
    usage: /midnightpump
    permission: pumpevents.admin
  boss:
    description: Spawn the PUMP world boss
    usage: /boss [@s|x y z]
    permission: pumpevents.admin
  bloodmoon:
    description: Start the Blood Moon monster event
    usage: /bloodmoon
    permission: pumpevents.admin
  pumpquake:
    description: Start the PUMP Quake event
    usage: /pumpquake
    permission: pumpevents.admin
  lightningstorm:
    description: Start a visual lightning storm
    usage: /lightningstorm
    permission: pumpevents.admin
  supplydrop:
    description: Spawn a randomized supply chest
    usage: /supplydrop [@s|x y z]
    permission: pumpevents.admin
  pumprain:
    description: Spawn collectible reward pumpkins
    usage: /pumprain
    permission: pumpevents.admin
  mobraid:
    description: Spawn a hostile mob wave
    usage: /mobraid [@s|x y z]
    permission: pumpevents.admin
permissions:
  pumpevents.admin:
    description: Allows starting PUMPEvents world events
    default: op
