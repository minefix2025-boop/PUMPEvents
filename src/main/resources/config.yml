# PUMPEvents configuration
meteor:
  # Number of falling magma-block visuals (clamped between 1 and 12).
  falling-block-count: 5
pumpkin:
  # If false, pumpkincreate will not replace non-air blocks.
  replace-blocks: false
pumpkin-hunt:
  # Event duration is clamped between 30 and 600 seconds.
  duration-seconds: 120
  # Emeralds awarded for each collected hunt pumpkin (clamped between 0 and 64).
  emeralds-per-pumpkin: 2
midnight:
  duration-seconds: 20
  spawn-mobs: true
boss:
  name: "&6&lPUMP WORLD BOSS"
  max-health: 300.0
  damage: 18.0
  movement-speed: 0.32
  reward-message: "&aThe PUMP World Boss has been defeated!"
